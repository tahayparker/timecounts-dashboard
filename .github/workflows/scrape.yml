name: Scrape Timecounts Volunteer Hours
on:
  # Run daily at 00:00 Sydney Time
  schedule:
    - cron: "0 0 * * *"
      timezone: "Australia/Sydney"
  # Allow manual trigger
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r script/requirements.txt
      - name: Debug Cloudflare response headers
        env:
          TIMECOUNTS_EMAIL: ${{ secrets.TIMECOUNTS_EMAIL }}
          TIMECOUNTS_PASSWORD: ${{ secrets.TIMECOUNTS_PASSWORD }}
          TIMECOUNTS_CLIENT_SECRET: ${{ secrets.TIMECOUNTS_CLIENT_SECRET }}
        run: |
          curl -s -D - -o /tmp/body.json https://api.timecounts.app/api/v2/oauth/token \
            -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"password\",\"client_id\":\"t31W3iIs7eZmRNuxXMEO0dwxIL2qGejPhlE_eoG-phY\",\"client_secret\":\"$TIMECOUNTS_CLIENT_SECRET\",\"email\":\"$TIMECOUNTS_EMAIL\",\"password\":\"$TIMECOUNTS_PASSWORD\"}" \
            | grep -iE "^(HTTP|cf-ray|cf-mitigated|cf-cache-status|server|x-|date):"
          echo "--- body ---"
          cat /tmp/body.json
      - name: Run scraper
        env:
          TIMECOUNTS_EMAIL: ${{ secrets.TIMECOUNTS_EMAIL }}
          TIMECOUNTS_PASSWORD: ${{ secrets.TIMECOUNTS_PASSWORD }}
          TIMECOUNTS_CLIENT_SECRET: ${{ secrets.TIMECOUNTS_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python script/scraper.py
      - name: Commit updated data
        run: |
          git config user.name "Taha Parker"
          git config user.email "98612931+tahayparker@users.noreply.github.com"
          git add data/
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: update volunteer hours data [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
